<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#223711">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E&amp;E Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>E&amp;E Tuindienste · Day Planner</title>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap">
<style id="app-style">
:root{--bg:#f6f7f2;--card:#ffffff;--ink:#1e2a14;--muted:#5d6852;--line:#dfe5d5;--green:#314d1c;--green-d:#223711;--moss:#6b8a45;--leaf:#eaf0e1;--clay:#4f7a2b;--clay-l:#e3edd6;--warn:#9a6b10;--warn-l:#fbf1d6;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{font-family:"Libre Caslon Text",Georgia,serif;font-weight:700;margin:0;letter-spacing:-.01em}
a{color:var(--green)}
.top{position:sticky;top:0;z-index:20;background:var(--green-d);color:#f4f1e6;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 10px calc(14px + env(safe-area-inset-left));box-shadow:0 2px 10px rgba(0,0,0,.15)}
.top .brand{height:34px;width:auto;display:block;flex:none}
.top .pg{font-family:"DM Sans",sans-serif;font-weight:500;font-size:13px;opacity:.8;border-left:1px solid rgba(255,255,255,.35);padding-left:10px}
.top h1{font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.homelogo{display:block;margin:10px auto 22px;width:min(78%,420px);height:auto}
.homesub{text-align:center;color:var(--muted);margin:-14px 0 20px;letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:700}
.iconbtn{background:none;border:0;color:inherit;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{background:rgba(255,255,255,.1)}
.iconbtn svg{width:22px;height:22px}
.sync{font-size:11px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap}
.sync.err{background:#a3412a}
main{max-width:1100px;margin:0 auto;padding:16px 14px 80px}
.hero{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:18px}
.bigbtn{display:flex;align-items:center;gap:14px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:transform .12s,box-shadow .12s}
.bigbtn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(29,59,37,.1)}
.bigbtn .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;background:var(--leaf);color:var(--green);flex:none}
.bigbtn .ic svg{width:28px;height:28px}
.bigbtn b{display:block;font-family:"Libre Caslon Text",Georgia,serif;font-size:19px}
.bigbtn span{color:var(--muted);font-size:13px}
.bigbtn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.bigbtn.primary .ic{background:rgba(255,255,255,.15);color:#fff}
.bigbtn.primary span{color:#d6e3d0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec-h{display:flex;align-items:center;gap:10px;margin:4px 0 12px;flex-wrap:wrap}
.sec-h h2{font-size:22px;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 14px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn svg{width:18px;height:18px;flex:none}
.btn:hover{border-color:#c9c0a8}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}
.btn.g:hover{background:var(--green-d)}
.btn.c{background:var(--clay);border-color:var(--clay);color:#fff}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:#a3412a}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:13px}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);margin-bottom:12px}
.clients{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.client{display:flex;flex-direction:column;gap:6px}
.client h3{font-size:18px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--leaf);color:var(--green-d);font-weight:500}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.pill.clay{background:var(--clay-l);color:var(--clay)}
.desc{font-size:13.5px;color:var(--muted);white-space:pre-wrap}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.tabs{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button.on{background:var(--green);color:#fff}
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.calbar h2{font-size:20px;flex:1;min-width:180px}
.nav{display:flex;gap:4px}
.nav .btn{padding:8px 10px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:"Libre Caslon Text",Georgia,serif;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.stops{display:flex;flex-direction:column}
.leg{display:flex;align-items:center;gap:8px;padding:6px 0 6px 22px;color:var(--muted);font-size:13px}
.leg::before{content:"";width:2px;height:22px;background:repeating-linear-gradient(var(--moss) 0 4px,transparent 4px 8px);margin-right:10px}
.stop{display:flex;gap:12px;align-items:flex-start}
.num{width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;margin-top:2px}
.stop.done .num{background:var(--moss)}
.stop.done h3{text-decoration:line-through;color:var(--muted)}
.stop .body{flex:1;min-width:0}
.stop .time{font-weight:700;color:var(--clay);font-size:13px}
.stop h3{font-size:17px}
.stop .addr{font-size:13.5px;color:var(--muted);word-break:break-word}
.stop .tools{display:flex;gap:2px;flex-wrap:wrap;margin-top:6px}
.stop .tools .btn{padding:5px 8px}
.base{display:flex;gap:12px;align-items:center;color:var(--muted);font-size:14px}
.base .num{background:var(--clay)}
.note{background:var(--warn-l);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wday{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:170px}
.wday.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.wday .wh{display:flex;align-items:center;justify-content:space-between;gap:4px;cursor:pointer}
.wday .wh b{font-size:13px}
.wday .wh .d{font-family:"Libre Caslon Text",Georgia,serif;font-size:22px;line-height:1}
.chip{font-size:12.5px;background:var(--leaf);border-radius:8px;padding:5px 7px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.done{opacity:.55;text-decoration:line-through}
.wday .wf{margin-top:auto;display:flex;gap:4px;justify-content:space-between;align-items:center}
.addic{width:30px;height:30px;border-radius:9px;border:1px dashed var(--moss);background:none;color:var(--green);display:grid;place-items:center;cursor:pointer;flex:none}
.addic:hover{background:var(--leaf)}
.addic svg{width:18px;height:18px}
.mapic{border-style:solid;border-color:var(--line)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .dow{font-size:12px;color:var(--muted);text-align:center;padding:4px 0;font-weight:500}
.mcell{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;overflow:hidden}
.mcell.out{opacity:.45}
.mcell.today{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.mcell .n{font-weight:700;font-size:13px}
.mcell .mchip{font-size:11.5px;background:var(--leaf);border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcell .more{font-size:11px;color:var(--muted)}
.mcell .addic{position:absolute;right:5px;top:5px;width:24px;height:24px}
.mcell .addic svg{width:15px;height:15px}
.mcell .cnt{display:none}
.modal-back{position:fixed;inset:0;background:rgba(20,30,22,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 18px 22px;animation:up .2s}
@media(min-width:700px){.modal-back{align-items:center}.modal{border-radius:20px}}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.5}}
.modal h2{font-size:21px;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f label{font-size:13px;font-weight:700}
.f input,.f textarea,.f select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f .hint{font-size:12px;color:var(--muted)}
.f input:focus,.f textarea:focus,.search:focus{outline:2px solid var(--moss);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
.err{color:#a3412a;font-size:13px;min-height:1em}
.pick{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.pick .body{flex:1;min-width:0}
.pick .addr{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--green-d);color:#fff;padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;animation:up .2s}
.todaycard{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.todaycard .body{flex:1;min-width:200px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:12px}
.check input{width:18px;height:18px}
.pinbox{background:var(--leaf);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pinbox .btn{width:100%}
.steps{margin:8px 0 10px;padding-left:20px;color:var(--muted)}
.steps li{margin-bottom:3px}
.pininput{width:100%;padding:12px;border:1.5px dashed var(--moss);border-radius:10px;background:#fff;font-size:16px}
.pininput:focus{outline:2px solid var(--moss);border-style:solid}
.pulse{animation:pulse 1.2s ease-in-out 3;border-color:var(--clay)}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(185,100,58,.25)}}
.login{max-width:420px;margin:0 auto;padding:30px 18px}
.login .homelogo{margin-top:30px}
details.gm{margin-top:10px;font-size:13px}
details.gm summary{cursor:pointer;color:var(--green);font-weight:500}
.mapov{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
.mapbar{display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--green-d);color:#fff}
.mpsearch{flex:1;display:flex;gap:6px;min-width:0}
.mpsearch input{flex:1;min-width:0;padding:9px 11px;border-radius:10px;border:0;font-size:16px}
.mpwrap{flex:1;position:relative;min-height:0}
#mp-map{position:absolute;inset:0}
.mpres{position:absolute;top:8px;left:8px;right:8px;z-index:1000;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-height:60%;overflow:auto}
.mpres button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:none;font-size:14px;cursor:pointer}
.mapfoot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(max-width:760px){
 .week{grid-template-columns:1fr}
 .wday{min-height:0}
 .wday .chips{display:flex;flex-wrap:wrap;gap:4px}
 .month{gap:3px}
 .mcell{min-height:62px;padding:4px}
 .mcell .mchip,.mcell .more{display:none}
 .mcell .cnt{display:block;margin-top:auto;font-size:11px;background:var(--green);color:#fff;border-radius:99px;text-align:center;padding:1px 0;font-weight:700}
 .mcell .addic{width:20px;height:20px;right:3px;top:3px;border-radius:6px}
 .mcell .addic svg{width:13px;height:13px}
 .two{grid-template-columns:1fr}
 .top .sync{display:none}
 .top .pg{display:none}
 .top .brand{margin-right:auto}
}
</style>
</head>

  var h='<img class="homelogo" src="'+LOGO_G+'" alt="E&amp;E Tuindienste"><div class="homesub">Day Planner</div><div class="hero">'+
   '<button class="bigbtn" data-act="go" data-v="clients"><span class="ic">'+I.users+'</span><span><b>Current clients</b><span>'+state.clients.length+' client'+(state.clients.length===1?'':'s')+' on file</span></span></button>'+
   '<button class="bigbtn" data-act="new-client"><span class="ic">'+I.userplus+'</span><span><b>Add new client</b><span>Name, address, garden &amp; job time</span></span></button>'+
   '<button class="bigbtn primary" data-act="open-cal"><span class="ic">'+I.cal+'</span><span><b>Business calendar</b><span>Daily, weekly &amp; monthly views</span></span></button>'+
  '</div>';
  h+='<div class="card todaycard"><div class="body"><h2 style="font-size:20px">Today · '+esc(fmt(k,{weekday:'long',day:'numeric',month:'long'}))+'</h2><div class="muted small">'+
    (n?n+' job'+(n===1?'':'s')+' · '+dur(p.work)+' work'+(p.km?' · ~'+p.km.toFixed(1)+' km driving':'')+' · finish ~'+hhmm(p.end):'Nothing booked yet.')+
   '</div></div><div class="row"><button class="btn" data-act="open-day" data-k="'+k+'">'+I.cal+'View day</button>'+(n?routeButtons(k):'<button class="btn g" data-act="add-to-day" data-k="'+k+'">'+I.plus+'Add client</button>')+'</div></div>';
  if(MODE==='local')h+='<div class="note" style="margin-top:14px">Not connected to the shared database yet, so everything is saved on this device only.</div>';
  if(!state.clients.length){
    h+='<div class="card empty" style="margin-top:14px"><h3>Getting started</h3><p>Add your clients, then book them onto days in the calendar. Each day can be put into the shortest driving order and opened in Google Maps.</p><div class="row" style="justify-content:center"><button class="btn g" data-act="new-client">'+I.userplus+'Add first client</button>'+(MODE==='local'?'<button class="btn" data-act="sample">Try with sample clients</button>':'')+'</div></div>';
  }else if(!state.settings.baseCoord&&!state.settings.base){
    h+='<div class="note" style="margin-top:14px">Tip: set your yard or depot address in <a href="#" data-act="settings">Settings</a> so each day’s route starts and finishes there.</div>';
  }
  return h;
}
function clientCard(c){
  var booked=0;Object.keys(state.jobs).forEach(function(k){if(k>=todayKey())(state.jobs[k]||[]).forEach(function(j){if(j.clientId===c.id)booked++;});});
  return '<div class="card client"><h3>'+esc(fullName(c))+'</h3>'+
   (c.phone?'<div class="small"><a href="tel:'+esc(String(c.phone).replace(/[^\d+]/g,''))+'">'+esc(c.phone)+'</a></div>':'')+
   '<div class="small muted" style="word-break:break-word">'+esc(isUrl(c.address)?'Google Maps link':c.address)+'</div>'+
   '<div class="meta">'+(c.size?'<span class="pill">'+esc(c.size)+' m²</span>':'')+'<span class="pill clay">'+dur(+c.minutes||0)+'</span>'+(c.coord?'<span class="pill">Map pin ✓</span>':'<span class="pill warn">No map pin</span>')+(booked?'<span class="pill">'+booked+' upcoming</span>':'')+'</div>'+
   (c.description?'<div class="desc">'+esc(c.description)+'</div>':'')+
   '<div class="row" style="margin-top:4px"><button class="btn sm g" data-act="book" data-id="'+c.id+'">'+I.cal+'Book</button><a class="btn sm" href="'+esc(mapSearch(c))+'" target="_blank" rel="noopener">'+I.map+'Map</a><button class="btn sm" data-act="edit-client" data-id="'+c.id+'">'+I.edit+'Edit</button><button class="btn sm ghost danger" data-act="del-client" data-id="'+c.id+'">'+I.trash+'</button></div></div>';
}
var clientQuery='';
function viewClients(){
  var h='<div class="sec-h"><h2>Current clients</h2><button class="btn g" data-act="new-client">'+I.userplus+'Add new client</button></div>';
  if(!state.clients.length)return h+'<div class="card empty"><h3>No clients yet</h3><p>Add your first client to start planning days.</p><div class="row" style="justify-content:center"><button class="btn g" data-act="new-client">'+I.userplus+'Add new client</button>'+(MODE==='local'?'<button class="btn" data-act="sample">Load sample clients</button>':'')+'</div></div>';
  h+='<input class="search" id="csearch" placeholder="Search by name, address or phone…" value="'+esc(clientQuery)+'">';
  h+='<div class="clients" id="clist">'+clientList()+'</div>';
  return h;
}
function matches(c,q){q=q.toLowerCase().trim();if(!q)return true;return [c.name,c.surname,c.phone,c.address,c.description].join(' ').toLowerCase().indexOf(q)>=0;}
function clientList(){
  var l=state.clients.filter(function(c){return matches(c,clientQuery);}).sort(function(a,b){return fullName(a).localeCompare(fullName(b));});
  return l.length?l.map(clientCard).join(''):'<div class="muted">No clients match.</div>';
}
function calHeader(){
  var k=ui.date, m=ui.calMode, title;
  if(m==='day')title=fmt(k,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  else if(m==='week'){var s=weekStart(k),e=addDays(s,6);title=fmt(s,{day:'numeric',month:'short'})+' – '+fmt(e,{day:'numeric',month:'short',year:'numeric'});}
  else title=fmt(k,{month:'long',year:'numeric'});
  return '<div class="calbar"><div class="tabs">'+['day','week','month'].map(function(x){return '<button class="'+(x===m?'on':'')+'" data-act="mode" data-m="'+x+'">'+x[0].toUpperCase()+x.slice(1)+'</button>';}).join('')+'</div>'+
   '<h2>'+esc(title)+'</h2><div class="nav"><button class="btn" data-act="nav" data-d="-1" aria-label="Previous">'+I.left+'</button><button class="btn" data-act="today">Today</button><button class="btn" data-act="nav" data-d="1" aria-label="Next">'+I.right+'</button></div><button class="btn" data-act="pdf" title="Save this '+m+' as a PDF to print">'+I.print+'PDF</button></div>';
}
function viewDay(){
  var k=ui.date, p=plan(k), s=state.settings, h='';
  h+='<div class="summary"><div class="stat"><b>'+p.rows.length+'</b><span>Jobs</span></div><div class="stat"><b>'+dur(p.work)+'</b><span>Work time</span></div><div class="stat"><b>'+(p.km?'~'+p.km.toFixed(1)+' km':'–')+'</b><span>Est. driving'+(p.drive?' · '+dur(p.drive):'')+'</span></div><div class="stat"><b>'+(p.rows.length?hhmm(p.end):'–')+'</b><span>Est. finish (start '+esc(s.startTime)+')</span></div></div>';
  h+='<div class="actions"><button class="btn g" data-act="add-to-day" data-k="'+k+'">'+I.plus+'Add client to this day</button>'+
     '<button class="btn" data-act="optimise" data-k="'+k+'"'+(p.rows.length<2&&!(p.rows.length&&s.baseCoord)?' disabled':'')+'>'+I.spark+'Optimise order</button>'+routeButtons(k)+'</div>';
  if(p.noPin)h+='<div class="note">'+p.noPin+' stop'+(p.noPin===1?' has':'s have')+' no map pin, so '+(p.noPin===1?'it':'they')+' can’t be placed in the optimised order or timed. Edit the client and add coordinates or a full Google Maps link.</div>';
  if(!p.rows.length)return h+'<div class="card empty"><h3>No jobs on this day</h3><p>Tap “Add client to this day” to book work in.</p></div>';
  h+='<div class="card"><div class="stops">';
  if(s.baseCoord||s.base)h+='<div class="base"><span class="num">'+I.home.replace('<svg','<svg width="18" height="18"')+'</span><div><b>Leave yard '+esc(s.startTime)+'</b><div class="small">'+esc(isUrl(s.base)?'Yard (map pin)':s.base||'Yard')+'</div></div></div>';
  p.rows.forEach(function(r,i){
    if(r.leg)h+='<div class="leg">'+(r.leg.unknown?'Drive time unknown (no map pin)':'~'+r.leg.km.toFixed(1)+' km · '+r.leg.min+' min drive')+'</div>';
    var c=r.c, tel=String(c.phone||'').replace(/[^\d+]/g,'');
    h+='<div class="stop'+(r.job.done?' done':'')+'"><span class="num">'+(r.job.done?I.check.replace('<svg','<svg width="18" height="18"'):(i+1))+'</span><div class="body">'+
      '<div class="time">'+hhmm(r.arr)+' – '+hhmm(r.dep)+' · '+dur(+c.minutes||0)+'</div><h3>'+esc(fullName(c))+'</h3>'+
      '<div class="addr">'+esc(isUrl(c.address)?'Google Maps link':c.address)+'</div>'+
      '<div class="meta" style="margin-top:4px">'+(c.size?'<span class="pill">'+esc(c.size)+' m²</span>':'')+(c.coord?'':'<span class="pill warn">No map pin</span>')+'</div>'+
      (c.description?'<div class="desc" style="margin-top:4px">'+esc(c.description)+'</div>':'')+
      '<div class="tools">'+(tel?'<a class="btn sm ghost" href="tel:'+esc(tel)+'">'+I.phone+esc(c.phone)+'</a>':'')+
      '<a class="btn sm ghost" href="'+esc(mapSearch(c))+'" target="_blank" rel="noopener">'+I.map+'</a>'+
      '<button class="btn sm ghost" data-act="job-move" data-k="'+k+'" data-i="'+i+'" data-d="-1" aria-label="Move up"'+(i===0?' disabled':'')+'>'+I.up+'</button>'+
      '<button class="btn sm ghost" data-act="job-move" data-k="'+k+'" data-i="'+i+'" data-d="1" aria-label="Move down"'+(i===p.rows.length-1?' disabled':'')+'>'+I.down+'</button>'+
      '<button class="btn sm ghost" data-act="job-done" data-k="'+k+'" data-i="'+i+'">'+I.check+(r.job.done?'Undo':'Done')+'</button>'+
      '<button class="btn sm ghost danger" data-act="job-del" data-k="'+k+'" data-i="'+i+'" aria-label="Remove">'+I.trash+'</button></div></div></div>';
  });
  if(p.back)h+='<div class="leg">'+(p.back.unknown?'Return drive unknown':'~'+p.back.km.toFixed(1)+' km · '+p.back.min+' min back')+'</div><div class="base"><span class="num">'+I.home.replace('<svg','<svg width="18" height="18"')+'</span><div><b>Back at yard ~'+hhmm(p.end)+'</b></div></div>';
  h+='</div></div><p class="small muted">Drive times here are straight-line estimates. Google Maps shows the exact distance and travel time for the route.</p>';
  return h;
}
function viewWeek(){
  var s=weekStart(ui.date), t=todayKey(), h='<div class="week">';
  for(var i=0;i<7;i++){
    var k=addDays(s,i), js=jobsOn(k), p=js.length?plan(k):null;
    h+='<div class="wday'+(k===t?' today':'')+'"><div class="wh" data-act="open-day" data-k="'+k+'"><div><b>'+esc(fmt(k,{weekday:'short'}))+'</b><div class="d">'+parseKey(k).getDate()+'</div></div>'+(p?'<span class="small muted">'+dur(p.work)+'</span>':'')+'</div><div class="chips">'+
      js.map(function(j){var c=client(j.clientId);return '<div class="chip'+(j.done?' done':'')+'" data-act="open-day" data-k="'+k+'">'+esc(fullName(c))+'</div>';}).join('')+
      '</div><div class="wf"><button class="addic" data-act="add-to-day" data-k="'+k+'" aria-label="Add client to '+esc(fmt(k,{weekday:'long'}))+'">'+I.plus+'</button>'+
      (js.length?(function(){var l=routeLinks(k);return l.length?'<a class="addic mapic" href="'+esc(l[0])+'" target="_blank" rel="noopener" aria-label="Open route">'+I.map+'</a>':'';})():'')+'</div></div>';
  }
  return h+'</div>';
}
function viewMonth(){
  var d=parseKey(ui.date), first=keyOf(new Date(d.getFullYear(),d.getMonth(),1)), start=weekStart(first), t=todayKey(), mo=d.getMonth();
  var h='<div class="month">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(function(x){return '<div class="dow">'+x+'</div>';}).join('');
  for(var i=0;i<42;i++){
    var k=addDays(start,i), dd=parseKey(k);
    if(i===35&&dd.getMonth()!==mo)break;
    var js=jobsOn(k);
    h+='<div class="mcell'+(dd.getMonth()!==mo?' out':'')+(k===t?' today':'')+'" data-act="open-day" data-k="'+k+'"><span class="n">'+dd.getDate()+'</span>'+
      js.slice(0,3).map(function(j){return '<span class="mchip">'+esc(client(j.clientId).name)+'</span>';}).join('')+
      (js.length>3?'<span class="more">+'+(js.length-3)+' more</span>':'')+(js.length?'<span class="cnt">'+js.length+'</span>':'')+
      '<button class="addic" data-act="add-to-day" data-k="'+k+'" aria-label="Add client">'+I.plus+'</button></div>';
  }
  return h+'</div>';
}
function render(){
  if(MODE==='cloud'&&(!user||!ready||loadErr)){root.innerHTML=gateView();wireGate();return;}
  var h=topbar()+'<main>';
  if(ui.view==='clients')h+=viewClients();
  else if(ui.view==='calendar')h+=calHeader()+(ui.calMode==='week'?viewWeek():ui.calMode==='month'?viewMonth():viewDay());
  else h+=viewHome();
  root.innerHTML=h+'</main>';
  saveUI();
  var cs=document.getElementById('csearch');
  if(cs)cs.addEventListener('input',function(){clientQuery=cs.value;document.getElementById('clist').innerHTML=clientList();});
}

/* ---------- modals ---------- */
var modalEl=null;
function openModal(html,onMount){
  closeModal();
  modalEl=document.createElement('div');modalEl.className='modal-back';
  modalEl.innerHTML='<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  modalEl.addEventListener('click',function(e){if(e.target===modalEl)closeModal();});
  modalEl.addEventListener('click',handle);
  document.body.appendChild(modalEl);
  if(onMount)onMount(modalEl);
}
function closeModal(){if(modalEl){modalEl.remove();modalEl=null;}try{localStorage.removeItem(LSDRAFT);}catch(e){}}
var LSDRAFT='ldp-draft', pickPending=false;
function pickUrl(addr,pin){
  var co=parseCoord(pin)||parseCoord(addr);
  if(co)return 'https://www.google.com/maps/search/?api=1&query='+co.lat+'%2C'+co.lng;
  if(addr&&isUrl(addr))return addr;
  if(addr)return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr);
  return 'https://www.google.com/maps';
}
function pinBox(id,val){
  return '<div class="pinbox"><div class="row" style="justify-content:space-between"><b>Map pin</b><span class="small muted">used to plan the best route</span></div>'+
   '<button type="button" class="btn g" id="'+id+'-map" style="margin:10px 0 8px">'+I.map+'Pick on map</button>'+
   '<input id="'+id+'" class="pininput" value="'+esc(val)+'" placeholder="Pin appears here (or paste coordinates)" autocomplete="off">'+
   '<div id="'+id+'-status" class="small" style="margin-top:8px"></div>'+
   '<details class="gm"><summary>Or copy a pin from Google Maps</summary>'+
   '<a class="btn sm" id="'+id+'-pick" href="https://www.google.com/maps" target="_blank" rel="noopener" style="margin:8px 0">'+I.map+'Open Google Maps</a>'+
   '<ol class="steps small"><li>Press and hold on the garden to drop a pin.</li><li>Tap the coordinates shown to copy them.</li><li>Come back and paste them into the box above.</li></ol></details></div>';
}
function wirePin(m,pinId,addrId){
  var pin=m.querySelector('#'+pinId), addr=m.querySelector('#'+addrId), pick=m.querySelector('#'+pinId+'-pick'), st=m.querySelector('#'+pinId+'-status');
  function upd(){
    pick.href=pickUrl(addr.value.trim(),pin.value.trim());
    var raw=pin.value.trim(), co=parseCoord(raw)||parseCoord(addr.value);
    if(co){
      pin.classList.remove('pulse');
      st.innerHTML='<span class="pill">Pin set ✓ '+co.lat.toFixed(5)+', '+co.lng.toFixed(5)+'</span> <a href="https://www.google.com/maps/search/?api=1&query='+co.lat+'%2C'+co.lng+'" target="_blank" rel="noopener">Check pin</a>';
    }else if(raw){st.innerHTML='<span class="pill warn">That doesn’t look like coordinates. Copy the numbers shown under the dropped pin.</span>';}
    else if(/goo\.gl|maps\.app/i.test(addr.value)){st.innerHTML='<span class="pill warn">Short share links don’t include the location. Use Pick on Google Maps.</span>';}
    else st.innerHTML='<span class="pill warn">No pin yet. This stop will still go on the route but can’t be auto-ordered.</span>';
  }
  pin.addEventListener('input',upd);addr.addEventListener('input',upd);
  m.querySelector('#'+pinId+'-map').onclick=function(){openMapPicker(parseCoord(pin.value)||parseCoord(addr.value),addr.value.trim(),function(co){pin.value=co.lat+', '+co.lng;pin.dispatchEvent(new Event('input',{bubbles:true}));toast('Pin set');});};
  pin.addEventListener('paste',function(){setTimeout(function(){var co=parseCoord(pin.value);if(co)pin.value=co.lat+', '+co.lng;upd();},0);});
  pick.addEventListener('click',function(){pickPending=pinId;});
  upd();
  return upd;
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||!pickPending||!modalEl)return;
  var pin=modalEl.querySelector('#'+pickPending);pickPending=false;
  if(pin&&!parseCoord(pin.value)){pin.value='';pin.classList.add('pulse');pin.scrollIntoView({block:'center'});pin.focus();
    var st=modalEl.querySelector('#'+pin.id+'-status');if(st)st.innerHTML='<span class="pill clay">Welcome back! Press and hold in the box above and tap Paste.</span>';}
});
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2800);}
function confirmBox(text,ok,fn){
  openModal('<h2>Are you sure?</h2><p>'+esc(text)+'</p><div class="mfoot"><button class="btn" data-act="close">Cancel</button><button class="btn c" id="okbtn">'+esc(ok)+'</button></div>',function(m){
    m.querySelector('#okbtn').onclick=function(){closeModal();fn();};
  });
}
function field(id,label,val,o){
  o=o||{};
  var inp=o.area?'<textarea id="'+id+'" placeholder="'+esc(o.ph||'')+'">'+esc(val)+'</textarea>':'<input id="'+id+'" type="'+(o.type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(o.ph||'')+'"'+(o.attrs||'')+'>';
  return '<div class="f"><label for="'+id+'">'+label+'</label>'+inp+(o.hint?'<span class="hint">'+o.hint+'</span>':'')+'</div>';
}
function clientForm(id,afterSave,draft){
  var c=draft||(id?client(id):{name:'',surname:'',phone:'',address:'',pin:'',description:'',size:'',minutes:''});
  var pinVal=draft?draft.pin:(c.pin||(c.coord&&!parseCoord(c.address)?c.coord.lat+', '+c.coord.lng:''));
  openModal('<h2>'+(id?'Edit client':'Add new client')+'</h2>'+
   '<div class="two">'+field('f-name','Name *',c.name,{attrs:' autocomplete="given-name"'})+field('f-surname','Surname',c.surname,{attrs:' autocomplete="family-name"'})+'</div>'+
   field('f-phone','Phone number',c.phone,{type:'tel',ph:'e.g. 087 123 4567'})+
   field('f-address','Google Maps address *',c.address,{ph:'Street address, Eircode, or a Google Maps link'})+
   pinBox('f-pin',pinVal)+
   field('f-desc','Garden description',c.description,{area:1,ph:'Front lawn, hedges along drive, raised beds out back…'})+
   '<div class="two">'+field('f-size','Garden size (m²)',c.size,{type:'number',attrs:' min="0" step="1" inputmode="numeric"'})+field('f-min','Time to complete (minutes) *',c.minutes,{type:'number',attrs:' min="1" step="5" inputmode="numeric"'})+'</div>'+
   '<div class="err" id="ferr"></div><div class="mfoot"><button class="btn" data-act="close">Cancel</button><button class="btn g" id="fsave">'+(id?'Save changes':'Add client')+'</button></div>',
  function(m){
    var g=function(x){return m.querySelector('#'+x);};
    wirePin(m,'f-pin','f-address');
    var ids=['f-name','f-surname','f-phone','f-address','f-pin','f-desc','f-size','f-min'], keys=['name','surname','phone','address','pin','description','size','minutes'];
    function keepDraft(){var v={};ids.forEach(function(x,i){v[keys[i]]=g(x).value;});try{localStorage.setItem(LSDRAFT,JSON.stringify({id:id||null,v:v,at:Date.now()}));}catch(e){}}
    ids.forEach(function(x){g(x).addEventListener('input',keepDraft);});
    g('f-pin').addEventListener('paste',function(){setTimeout(keepDraft,0);});
    g('f-pin-pick').addEventListener('click',keepDraft);
    keepDraft();
    if(!draft)g('f-name').focus();
    g('fsave').onclick=function(){
      var d={name:g('f-name').value.trim(),surname:g('f-surname').value.trim(),phone:g('f-phone').value.trim(),address:g('f-address').value.trim(),pin:g('f-pin').value.trim(),description:g('f-desc').value.trim(),size:g('f-size').value.trim(),minutes:parseInt(g('f-min').value,10)||0};
      if(!d.name||!d.address||!d.minutes){g('ferr').textContent='Please fill in name, address and time to complete.';return;}
      d.coord=parseCoord(d.pin)||parseCoord(d.address);
      if(id){Object.assign(client(id),d);}else{d.id=uid();state.clients.push(d);}
      save();closeModal();render();toast(id?'Client updated':'Client added');
      if(afterSave)afterSave(id||d.id);
    };
  });
}
function picker(k){
  var q='';
  function list(){
    var booked={};(state.jobs[k]||[]).forEach(function(j){booked[j.clientId]=1;});
    var l=state.clients.filter(function(c){return matches(c,q);}).sort(function(a,b){return fullName(a).localeCompare(fullName(b));});
    if(!state.clients.length)return '<div class="empty">No clients yet.</div>';
    return l.map(function(c){return '<div class="pick"><div class="body"><b>'+esc(fullName(c))+'</b> <span class="small muted">· '+dur(+c.minutes||0)+'</span><div class="addr">'+esc(isUrl(c.address)?'Google Maps link':c.address)+'</div></div>'+
      (booked[c.id]?'<button class="btn sm" data-act="unpick" data-id="'+c.id+'">'+I.check+'Added</button>':'<button class="btn sm g" data-act="pick" data-id="'+c.id+'">'+I.plus+'Add</button>')+'</div>';}).join('')||'<div class="muted small">No clients match.</div>';
  }
  openModal('<h2>Add to '+esc(fmt(k,{weekday:'long',day:'numeric',month:'long'}))+'</h2><input class="search" id="psearch" placeholder="Search clients…"><div id="plist">'+list()+'</div><div class="mfoot"><button class="btn" data-act="pick-new">'+I.userplus+'New client</button><button class="btn g" data-act="close">Done</button></div>',function(m){
    var ps=m.querySelector('#psearch');
    ps.addEventListener('input',function(){q=ps.value;m.querySelector('#plist').innerHTML=list();});
    m._refresh=function(){m.querySelector('#plist').innerHTML=list();};
    m._k=k;
  });
}
function bookModal(id){
  var c=client(id);
  openModal('<h2>Book '+esc(fullName(c))+'</h2>'+field('b-date','Day','',{type:'date'})+'<div class="err" id="berr"></div><div class="mfoot"><button class="btn" data-act="close">Cancel</button><button class="btn g" id="bok">Book</button></div>',function(m){
    var inp=m.querySelector('#b-date');inp.value=ui.date>=todayKey()?ui.date:todayKey();

  'open-cal':function(){ui.view='calendar';render();},
  mode:function(d){ui.calMode=d.m;render();},
  nav:function(d){var n=+d.d;ui.date=ui.calMode==='day'?addDays(ui.date,n):ui.calMode==='week'?addDays(ui.date,7*n):addMonths(ui.date,n);render();},
  today:function(){ui.date=todayKey();render();},
  'open-day':function(d){ui.view='calendar';ui.calMode='day';ui.date=d.k;render();window.scrollTo(0,0);},
  'add-to-day':function(d){picker(d.k);},
  'new-client':function(){clientForm(null);},
  'edit-client':function(d){clientForm(d.id);},
  'del-client':function(d){var c=client(d.id),n=0;Object.keys(state.jobs).forEach(function(k){n+=(state.jobs[k]||[]).filter(function(j){return j.clientId===d.id;}).length;});
    confirmBox('Delete '+fullName(c)+(n?' and their '+n+' booking'+(n===1?'':'s'):'')+'?','Delete',function(){state.clients=state.clients.filter(function(x){return x.id!==d.id;});Object.keys(state.jobs).forEach(function(k){state.jobs[k]=state.jobs[k].filter(function(j){return j.clientId!==d.id;});if(!state.jobs[k].length)delete state.jobs[k];});save();render();toast('Client deleted');});},
  book:function(d){bookModal(d.id);},
  pick:function(d){var k=modalEl&&modalEl._k;if(k&&addJob(k,d.id)){modalEl._refresh();render();}},
  unpick:function(d){var k=modalEl&&modalEl._k;if(!k)return;state.jobs[k]=(state.jobs[k]||[]).filter(function(j){return j.clientId!==d.id;});if(!state.jobs[k].length)delete state.jobs[k];save();modalEl._refresh();render();},
  'pick-new':function(){var k=modalEl&&modalEl._k;clientForm(null,function(id){addJob(k,id);render();picker(k);});},
  'job-move':function(d){var l=jobsList(d.k),i=+d.i,j=i+(+d.d);if(j<0||j>=l.length)return;var t=l[i];l[i]=l[j];l[j]=t;state.jobs[d.k]=l;save();render();},
  'job-done':function(d){var l=jobsList(d.k);l[+d.i].done=!l[+d.i].done;state.jobs[d.k]=l;save();render();},
  'job-del':function(d){var l=jobsList(d.k);l.splice(+d.i,1);state.jobs[d.k]=l;if(!l.length)delete state.jobs[d.k];save();render();},
  optimise:function(d){optimise(d.k);},
  pdf:function(){makePdf();},
  forgot:function(){var em=(document.getElementById('l-email')||{}).value||'',er=document.getElementById('lerr');if(!em.trim()){er.textContent='Type your email above first, then tap Forgot password.';return;}
    FB.reset(em.trim()).then(function(){er.textContent='';toast('Password reset email sent to '+em.trim());}).catch(function(x){er.textContent=authMsg(x);});},
  signout:function(){closeModal();if(FB)FB.signOut();},
  reload:function(){location.reload();},
  settings:function(){settingsModal();},
  sample:function(){loadSample();},
  close:function(){closeModal();}
};
function jobsList(k){state.jobs[k]=jobsOn(k);return state.jobs[k];}
function handle(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var f=ACT[t.dataset.act];if(!f)return;
  e.preventDefault();e.stopPropagation();f(t.dataset,t,e);
}
root.addEventListener('click',handle);
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;var mo=document.querySelector('.mapov');if(mo)mo.close();else closeModal();});
function restoreDraft(){
try{var dr=JSON.parse(localStorage.getItem(LSDRAFT)||'null');
  if(dr&&dr.v&&Date.now()-dr.at<6*3600e3&&(!dr.id||client(dr.id))){clientForm(dr.id,null,dr.v);toast('Picked up where you left off');}
}catch(e){}
}
render();
if(MODE==='cloud')startCloud();else restoreDraft();
})();
</script>
</body>
</html>
